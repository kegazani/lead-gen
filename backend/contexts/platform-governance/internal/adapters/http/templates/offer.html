{{- define "content" -}}
<section class="offer-form">
  <h1>{{ text "portal.offer.title" }}</h1>
  {{- with .View.Notice }}
  <p class="notice" role="status">{{.}}</p>
  {{- end }}
  <form method="post" action="/portal/request">
    {{ template "field" .View.ContentField }}
    {{ template "field" .View.TargetField }}
    <button type="submit">{{ text "portal.offer.submit" }}</button>
  </form>
</section>
{{- end -}}
