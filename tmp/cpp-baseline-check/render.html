<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>determinism-probe</title>
<style>
  @page { size: A4; margin: 18mm; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  h1 { font-size: 17pt; }
  .box { border: 1px solid #222; padding: 8px 12px; margin: 6px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cell { border: 1px dashed #666; padding: 6px; font-size: 9pt; }
</style>
</head>
<body>
  <h1>Determinism probe</h1>
  <p>Cyrillic: Проверка детерминированности рендеринга. Digits: 0123456789. Symbols: &amp; &lt; &gt; «» — …</p>
  <div class="box">Line 1: the quick brown fox jumps over the lazy dog</div>
  <div class="box">Line 2: 1234567890 &nbsp; ABCDEFGHIJ</div>
  <div class="grid">
    <div class="cell">cell A</div><div class="cell">cell B</div><div class="cell">cell C</div>
    <div class="cell">cell D</div><div class="cell">cell E</div><div class="cell">cell F</div>
  </div>
</body>
</html>
