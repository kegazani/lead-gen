{{- define "nav" -}}
<nav class="sidebar" aria-label="{{ text "nav.label" }}">
  <ul class="sidebar-list">
  {{- range .Items }}
    <li><a href="{{.Href}}"{{if .Active}} class="is-active" aria-current="page"{{end}}>{{.Label}}</a></li>
  {{- end }}
  </ul>
  <button class="theme-toggle" id="theme-toggle" type="button"
    aria-label="{{ text "nav.theme.toggle" }}"
    data-theme-label-system="{{ text "nav.theme.system" }}"
    data-theme-label-light="{{ text "nav.theme.light" }}"
    data-theme-label-dark="{{ text "nav.theme.dark" }}"
    data-theme-aria="{{ text "nav.theme.aria" }}">
    <span class="theme-toggle-label">{{ text "nav.theme.label" }}</span>
    <b class="theme-toggle-value" data-theme-name>{{ text "nav.theme.system" }}</b>
  </button>
</nav>
{{- end -}}
