# admin-proxy — единый вход всех админских консолей под одним origin.
#
# Маршрутизация по префиксам путей на сервисы контура. Префикс НЕ снимается на
# уровне nginx: сервис получает полный путь (/lead-console/validation, /admin/console/…)
# и сам снимает префикс общим middleware `components.PrefixMiddleware`, который
# переписывает ссылки, формы, HTMX-атрибуты и редиректы обратно под префикс.
# Так ссылки навигации не покидают origin.
#
# Карта префиксов:
#   /admin/        → platform:8087   (платформенная консоль: /console, /platform)
#   /lead-console/ → demand:8082     (lead-management)
#   /intake/       → intake:8085     (request-fulfillment)
#   /reporting/    → core:8081       (analytics)
#   /mailing/      → core:8080       (outreach-orchestration)
#
# Клиентский портал (/login, /portal, /profile) остаётся на platform:8087 и через
# admin-proxy не маршрутизируется — это не админский фронт.

server {
    listen 8000;
    server_name _;

    # SSE-потоки (дашборд, заявки компании, ассистент) и HTMX-запросы требуют
    # отсутствия буферизации и долгого таймаута чтения, чтобы поток не рвался.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # X-Forwarded-Proto в dev — $scheme (клиент подключается напрямую к nginx по
    # HTTP). При TLS-терминации впереди (балансировщик/LB) замените на
    # $http_x_forwarded_proto (или map с учётом доверенной сети), чтобы сервисы
    # видели исходную схему запроса; здесь dev-логику не меняем.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Корень единого входа ведёт во вход оператора платформенной консоли.
    location = / {
        return 302 /admin/console;
    }

    # /admin/ (со слэшем) ведёт на вход консоли, а не на корень портала
    # (platform-governance отвечает на / редиректом /login клиентского портала).
    location = /admin/ {
        return 302 /admin/console/login;
    }

    # Префиксы без завершающего слэша дают 404 у сервисов: перенаправляем на тот же
    # путь со слэшем, чтобы адрес с префиксом без слэша тоже открывал консоль.
    location = /admin {
        return 302 /admin/;
    }
    location = /lead-console {
        return 302 /lead-console/;
    }
    location = /intake {
        return 302 /intake/;
    }
    location = /reporting {
        return 302 /reporting/;
    }
    location = /mailing {
        return 302 /mailing/;
    }

    # Платформенная консоль platform-governance.
    location /admin/ {
        proxy_pass http://platform:8087;
    }

    # Консоль лидов lead-management.
    location /lead-console/ {
        proxy_pass http://demand:8082;
    }

    # Консоль заявок request-fulfillment.
    location /intake/ {
        proxy_pass http://intake:8085;
    }

    # Отчёты и дашборд analytics.
    location /reporting/ {
        proxy_pass http://core:8081;
    }

    # Консоль рассылок outreach-orchestration.
    location /mailing/ {
        proxy_pass http://core:8080;
    }
}
