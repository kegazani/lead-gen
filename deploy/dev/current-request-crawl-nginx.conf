server {
    listen 8000;
    server_name _;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        return 302 /admin/console/login;
    }
    location = /admin {
        return 302 /admin/;
    }
    location = /lead-console {
        return 302 /lead-console/;
    }
    location = /intake {
        limit_except GET HEAD { deny all; }
        return 302 /intake/;
    }

    # Публичный портал клиента остаётся на том же origin, но использует
    # собственные серверные проверки сессии и CSRF.
    location = /register {
        proxy_pass http://leadgen-lccrc-app:29202;
    }
    location = /login {
        proxy_pass http://leadgen-lccrc-app:29202;
    }
    location = /portal {
        proxy_pass http://leadgen-lccrc-app:29202;
    }
    location = /profile {
        proxy_pass http://leadgen-lccrc-app:29202;
    }
    location /admin/ {
        proxy_pass http://leadgen-lccrc-app:29202;
    }
    location /lead-console/ {
        proxy_pass http://leadgen-lccrc-app:29200;
    }

    # Вход и выход request-консоли: backend сам проверяет пароль и сессию.
    location = /intake/login {
        limit_except GET POST { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location = /intake/logout {
        limit_except GET { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }

    # Только экранные GET и публичная статика. Owner JSON API (/requests,
    # /requests/{id}, /workflow, /email-drafts, /fulfillment-status) сюда не входят.
    location = /intake/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location = /intake/validation {
        limit_except GET HEAD { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location = /intake/approvals {
        limit_except GET HEAD { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location = /intake/company {
        limit_except GET HEAD { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location = /intake/company/stream {
        limit_except GET HEAD { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location ^~ /intake/static/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location ~ ^/intake/requests/[^/]+/(validation|approval)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location ~ ^/intake/requests/[^/]+/validation/(take|offer|approve|reject|call)$ {
        limit_except POST { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location ~ ^/intake/requests/[^/]+/approval/(approve|reject)$ {
        limit_except POST { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }
    location ~ ^/intake/requests/[^/]+/(revision|cancel|rerun)$ {
        limit_except POST { deny all; }
        proxy_pass http://leadgen-lccrc-app:29201;
    }

    # Закрытый по умолчанию request-префикс: неизвестный путь и любой owner
    # endpoint завершаются в proxy и не доходят до request-fulfillment.
    location /intake/ {
        return 404;
    }
}
