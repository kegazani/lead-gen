# Один origin для клиентского портала и трёх операторских консолей демо.
server {
    listen 8000;
    server_name _;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /admin { return 302 /admin/; }
    location = /admin/ { return 302 /admin/console; }
    location = /intake { return 302 /intake/; }
    location = /lead-console { return 302 /lead-console/; }
    location = /reporting { return 302 /reporting/; }

    location /admin/ { proxy_pass http://app:19081; }
    location /intake/ { proxy_pass http://app:19080; }
    location /lead-console/ { proxy_pass http://demand:19082; }
    location /reporting/ { proxy_pass http://reports:19083; }
    location / { proxy_pass http://app:19081; }
}
